name: Build LiveEarth (unsigned IPA)

on:
  push:
    branches:
      - claude/live-earth-weather-map-aqcii3
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build LiveEarth.ipa
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build app without code signing
        run: |
          xcodebuild \
            -project LiveEarth.xcodeproj \
            -scheme LiveEarth \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/LiveEarth.app" Payload/
          zip -qry LiveEarth.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: LiveEarth-unsigned-ipa
          path: LiveEarth.ipa
          retention-days: 30
