name: Build iOS app (unsigned IPA)

on:
  push:
    branches:
      - claude/meditation-frequency-app-emxor7
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Resonance.ipa
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Inject backend secrets
        env:
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
          APP_SHARED_SECRET: ${{ secrets.APP_SHARED_SECRET }}
        run: |
          mkdir -p Resonance/Generated
          cat > Resonance/Generated/Secrets.swift <<EOF
          enum Secrets {
              static let backendURL = "${BACKEND_URL}"
              static let appSharedSecret = "${APP_SHARED_SECRET}"
              static var isConfigured: Bool { !backendURL.isEmpty && !appSharedSecret.isEmpty }
          }
          EOF

      - name: Build app without code signing
        run: |
          xcodebuild \
            -project Resonance.xcodeproj \
            -scheme Resonance \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/Resonance.app" Payload/
          zip -qry Resonance.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-unsigned-ipa
          path: Resonance.ipa
          retention-days: 30
