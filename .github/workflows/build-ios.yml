name: Build iOS app (unsigned IPA)

on:
  push:
    branches:
      - claude/meditation-frequency-app-emxor7
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Resonance.ipa
    runs-on: macos-15
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build app without code signing
        run: |
          xcodebuild \
            -project Resonance.xcodeproj \
            -scheme Resonance \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          mkdir Payload
          cp -R "build/Build/Products/Release-iphoneos/Resonance.app" Payload/
          zip -qry Resonance.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Resonance-unsigned-ipa
          path: Resonance.ipa
          retention-days: 30
